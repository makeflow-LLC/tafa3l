<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Tapio</title>
    <meta name="description" content="" />
    <meta name="theme-color" content="#12102e" />
    <link rel="icon" href="/assets/icon.svg?v=1.69.0" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png?v=1.69.0" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/assets/css/app.css?v=1.69.0" />
    <!-- قبل أي رسم: اللغة والاتجاه، فلا تظهر ومضة اتجاه خاطئ -->
    <script src="/assets/js/theme.js?v=1.69.0"></script>
    <script src="/assets/js/i18n.js?v=1.69.0"></script>
  </head>
  <body>
    <div class="topbar">
      <a class="brand" href="/" style="text-decoration: none; color: inherit">
        <img class="logo light-only" src="/assets/logo.svg?v=1.69.0" alt="Tapio" width="249" height="159" /><img class="logo dark-only" src="/assets/logo-white.svg?v=1.69.0" alt="Tapio" width="249" height="159" />
      </a>
      <div class="topbar-actions" id="langRow">
        <a class="btn ghost sm" href="/" data-nav="home"></a>
      </div>
    </div>

    <div class="wrap" id="app"></div>

    <script src="/assets/js/common.js?v=1.69.0"></script>
    <script src="/assets/js/legal.js?v=1.69.0"></script>
    <script src="/assets/js/footer.js?v=1.69.0"></script>
    <script>
      window.I18n.mountToggle(document.getElementById('langRow'));
      window.Theme?.mountToggle(document.getElementById('langRow'), { toDark: window.I18n.t('themeToDark'), toLight: window.I18n.t('themeToLight') });
      window.Legal.render(document.getElementById('app'), 'privacy');
      window.SiteFooter.mount();
    </script>
