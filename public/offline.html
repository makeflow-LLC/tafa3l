<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tapio</title>
    <link rel="icon" href="/assets/icon.svg?v=1.77.0" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png?v=1.77.0" />
    <style>
      /*
       * أنماطٌ مضمّنة لا ملفّ خارجي: هذه الصفحة تُعرَض حين تنقطع الشبكة،
       * فأي رابطٍ إلى app.css قد لا يصل. ولذلك تُكرَّر رموز اللون هنا —
       * وتُكرَّر **في السِمَتين** كي لا تومض بيضاء في وجه من يقرأ ليلاً.
       */
      :root { --bg: #faf9f6; --text: #221b5b; --muted: #6e6a8f; --brand: #7a5fe0; --on-brand: #ffffff; }
      html.dark { --bg: #171240; --text: #ffffff; --muted: #a29dc6; --brand: #8f78e8; --on-brand: #171240; color-scheme: dark; }
      body { font-family: system-ui, "Segoe UI", Tahoma, sans-serif; display: grid; place-items: center;
             min-height: 100vh; margin: 0; background: var(--bg); color: var(--text); text-align: center; padding: 24px; }
      .em { font-size: 56px; }
      h1 { font-size: 1.25rem; margin: 12px 0 6px; }
      p { color: var(--muted); margin: 0 0 18px; line-height: 1.9; }
      button { font: inherit; border: 0; border-radius: 999px; padding: 12px 22px; cursor: pointer;
               background: var(--brand); color: var(--on-brand); }
    </style>
    <script src="/assets/js/theme.js?v=1.77.0"></script>
  </head>
  <body>
    <div>
      <div class="em">📡</div>
      <h1 id="title"></h1>
      <p id="body"></p>
      <button type="button" onclick="location.reload()" id="retry"></button>
    </div>
    <script>
      // صفحة مستقلة تعمل بلا شبكة، فلا تستطيع تحميل قاموس الترجمة
      var en = (navigator.language || 'ar').toLowerCase().indexOf('ar') !== 0;
      document.documentElement.lang = en ? 'en' : 'ar';
      document.documentElement.dir = en ? 'ltr' : 'rtl';
      document.getElementById('title').textContent = en ? 'No internet connection' : 'لا يوجد اتصال بالإنترنت';
      document.getElementById('body').textContent = en
        ? 'Tapio needs a connection to run live sessions. Check your network and try again.'
        : 'يحتاج Tapio اتصالاً لتشغيل الجلسات المباشرة. تحقّق من شبكتك ثم أعد المحاولة.';
      document.getElementById('retry').textContent = en ? 'Try again' : 'أعد المحاولة';
    </script>
  </body>
</html>
