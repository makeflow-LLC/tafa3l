<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Tapio</title>
    <meta name="description" content="منصة خفيفة لإنشاء أسئلة تفاعلية واستطلاعات حية للمدربين والمعلمين. بلا تسجيل وبلا تخزين دائم." />
    <meta name="theme-color" content="#171240" />
    <link rel="icon" href="/assets/icon.svg?v=1.99.0" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png?v=1.99.0" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/assets/css/app.css?v=1.99.0" />
    <link rel="stylesheet" href="/assets/css/entry.css?v=1.99.0" />
    <script src="/assets/js/theme.js?v=1.99.0"></script>
    <script src="/assets/js/i18n.js?v=1.99.0"></script>
  </head>
  <body class="tp-entry">
    <div class="tp-col">
      <!-- طبقات الخلفية: تدرّجات CSS لا صور، وخارج مسار اللمس -->
      <div class="tp-fx tp-fx--dots" aria-hidden="true"></div>
      <div class="tp-fx tp-fx--glow-a" aria-hidden="true"></div>
      <div class="tp-fx tp-fx--glow-b" aria-hidden="true"></div>

      <!-- الشريط: السِمَة في طرفٍ، ومدخل المعلّم في الطرف الآخر -->
      <header class="tp-bar tp-rise" style="--rise: 0ms">
        <span id="langRow" style="display: contents"></span>
        <span class="grow"></span>
        <a class="tp-pill" id="topAccount" href="/api/auth/google?next=%2Fhost.html%23%2Fmine"></a>
      </header>

      <div class="tp-hero">
        <div class="tp-rise" style="--rise: 80ms">
          <div class="tp-hero__float">
            <span class="tp-hero__ring" aria-hidden="true"></span>
            <img class="tp-hero__logo light-only" src="/assets/logo.svg?v=1.99.0" alt="Tapio" width="249" height="159" /><img
              class="tp-hero__logo dark-only"
              src="/assets/logo-white.svg?v=1.99.0"
              alt="Tapio"
              width="478"
              height="315"
            />
          </div>
        </div>
        <p class="tp-hero__tag tp-rise" id="tagline" style="--rise: 160ms"></p>
        <span class="tp-badge tp-rise hidden" id="welcome" style="--rise: 220ms"></span>
      </div>

      <!-- الطالب أولاً: زرٌّ واحد ينقل إلى شاشة الرمز، لا خانات على الرئيسية -->
      <section class="tp-panel tp-panel--first tp-rise" style="--rise: 290ms">
        <div class="tp-panel__head">
          <span class="tp-dot" aria-hidden="true"></span>
          <h2 id="joinTitle"></h2>
        </div>
        <p class="tp-panel__note" id="joinNote"></p>
        <a class="tp-act tp-act--teal" href="/join.html" id="joinCta"></a>
      </section>

      <section class="tp-panel tp-rise" style="--rise: 360ms">
        <div class="tp-panel__head">
          <span class="tp-dot tp-dot--warm" aria-hidden="true"></span>
          <h2 id="teacherTitle"></h2>
          <span id="teacherHint"></span>
        </div>
        <p class="tp-panel__note" id="teacherNote"></p>
        <div class="tp-stack">
          <a class="tp-act tp-act--purple" id="accountLink" href="/api/auth/google?next=%2Fhost.html%23%2Fmine"></a>
          <p class="tp-panel__note hidden" id="trialPromise" style="margin: 0; text-align: center"></p>
          <div class="tp-duo">
            <a class="tp-act tp-act--chip on-teal" href="/host.html" id="createBtn"></a>
            <a class="tp-act tp-act--chip on-warm" href="/host.html#/game-ai" id="createGameBtn"></a>
          </div>
          <a class="tp-act tp-act--chip on-teal hidden" id="resumeLink" href="#"></a>
        </div>
      </section>

      <nav class="tp-links tp-rise" style="--rise: 430ms">
        <a href="/help.html" id="guideBtn"></a>
        <span class="sep" aria-hidden="true">•</span>
        <a href="/games.html" id="gamesBtn"></a>
        <!-- «سجلّي»: يظهر لمن دخل نشاطاً بملفّه في فصله — وحده يعرف أن له سجلّاً -->
        <span class="sep hidden" id="recordSep" aria-hidden="true">•</span>
        <a class="hidden" href="/me.html" id="recordBtn"></a>
        <span class="sep hidden" id="logoutSep" aria-hidden="true">•</span>
        <a class="muted hidden" href="#" id="logoutBtn"></a>
      </nav>
    </div>

    <script src="/assets/js/avatar.js?v=1.99.0"></script>
    <script src="/assets/js/common.js?v=1.99.0"></script>
    <script src="/assets/js/footer.js?v=1.99.0"></script>
    <script>
      (function () {
        const { $, api, store, serverAlive, showOfflineBanner } = window.T;
        const t = window.I18n.t;

        document.title = t('brand') + ' — ' + t('homeTagline');
        window.Theme?.mountToggle($('#langRow'), { toDark: t('themeToDark'), toLight: t('themeToLight') });

        $('#tagline').textContent = t('homeTagline');
        $('#topAccount').textContent = t('homeLoginShort');
        $('#joinTitle').textContent = t('homeStudentTitle');
        $('#joinNote').textContent = t('homeStudentNote');
        $('#joinCta').textContent = t('homeJoinCta');
        $('#teacherTitle').textContent = t('homeTeacherTitle');
        $('#teacherNote').textContent = t('homeTeacherNote');
        $('#teacherHint').append(window.T.hintDot(t('homeTeacherBody')));
        $('#createBtn').textContent = t('homeCreateActivityBtn');
        $('#createGameBtn').textContent = t('homeCreateGameBtn');
        $('#gamesBtn').textContent = t('gNav');

        /**
         * سجلّ الطالب على هذا الجهاز: رابطٌ يظهر لصاحبه وحده.
         *
         * ولا يُعرض لمن لا سجلّ له: رابطٌ إلى صفحةٍ تقول «لا سجلّ هنا» يزعج
         * أكثر ممّا يفيد، والطالب الذي دخل بملفّه مرّةً يجد الرابط في مكانه.
         */
        try {
          const mine = JSON.parse(localStorage.getItem('tafa3l:records') || '{}');
          if (mine && Object.keys(mine).length) {
            $('#recordBtn').textContent = t('meTitle');
            $('#recordBtn').classList.remove('hidden');
            $('#recordSep').classList.remove('hidden');
          }
        } catch {
          /* الوضع الخاص قد يمنع التخزين */
        }
        $('#guideBtn').textContent = t('hteacherGuide');
        $('#accountLink').textContent = t('homeLoginBtn');

        // تشخيص مبكر: إن كان الخادم غير متاح نشرح السبب بدل رسالة خطأ غامضة
        serverAlive().then((alive) => {
          if (!alive) showOfflineBanner(document.querySelector('.tp-col'));
        });

        /**
         * رمزٌ في العنوان (‎/?code=‎ من رابطٍ قديم): نمرّره إلى صفحة اللعب
         * بدل أن نُبقي حقل رمزٍ في الواجهة. الروابط القديمة تبقى تعمل، والزائر
         * الذي لا رمز معه لا يُسأل عن رمز أصلاً.
         */
        const preset = new URLSearchParams(location.search).get('code');
        if (preset && /^\d{4,8}$/.test(preset)) location.replace('/play.html?code=' + preset);

        api('/api/auth/me')
          .then(({ user, premium }) => {
            // التهنئة وسؤال البلد هنا أيضاً: وجهة ما بعد الدخول قد تكون هذه
            // الصفحة لا لوحة المعلّم، والبلد مطلوبٌ أينما هبط
            window.T.afterLogin(user, premium);

            if (!user) {
              /*
               * بلا حساب: بطاقة المعلّم تبقى كما هي ويتبدّل فعلُها الأوّل إلى
               * الدخول. المخطوطة تُخفي البطاقة كلّها عند غياب الجلسة، وذلك
               * يترك المعلّم الزائر بلا طريقٍ إلى المنصّة أصلاً — وهو أول من
               * تُكتب له هذه الصفحة.
               */
              const days = premium?.plan?.signupTrialDays || 0;
              if (days) {
                const note = $('#trialPromise');
                note.textContent = t('loginTrialBadge', { days });
                note.classList.remove('hidden');
              }
              return;
            }

            const name = window.T.firstName(user.name, user.name);
            const link = $('#accountLink');
            link.href = '/host.html#/mine';
            link.textContent = t('homeMyActivities', { name });
            const top = $('#topAccount');
            top.href = '/host.html#/mine';
            top.textContent = t('homeMyActivitiesShort');

            const hello = $('#welcome');
            hello.textContent = t('homeWelcome', { name });
            hello.classList.remove('hidden');

            const out = $('#logoutBtn');
            out.textContent = t('homeLogoutBtn');
            out.classList.remove('hidden');
            $('#logoutSep').classList.remove('hidden');
            out.addEventListener('click', async (event) => {
              event.preventDefault();
              await api('/api/auth/logout', { method: 'POST' }).catch(() => {});
              location.reload();
            });
          })
          .catch(() => {});

        // استئناف جلسة مدرب سابقة (المفتاح محفوظ في المتصفح فقط)
        const last = store.local.get('tafa3l:host:last', null);
        if (last?.code && last?.hostToken) {
          api('/api/sessions/' + last.code)
            .then(() => {
              const resume = $('#resumeLink');
              resume.href = '/host.html#/live/' + last.code;
              resume.textContent = t('homeResumeBtn', { title: last.title || last.code });
              resume.classList.remove('hidden');
            })
            .catch(() => {});
        }
      })();

      window.SiteFooter.mount();
    </script>
  </body>
</html>
