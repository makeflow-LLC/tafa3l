<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Tapio</title>
    <meta name="description" content="منصة خفيفة لإنشاء أسئلة تفاعلية واستطلاعات حية للمدربين والمعلمين. بلا تسجيل وبلا تخزين دائم." />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" href="/assets/icon.svg?v=1.53.0" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png?v=1.53.0" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/assets/css/app.css?v=1.53.0" />
    <script src="/assets/js/i18n.js?v=1.53.0"></script>
  </head>
  <body>
    <div class="wrap narrow">
      <div class="row" style="gap: 8px; padding-top: 10px">
        <!-- زرّ الحساب هنا وملوّن: معلّمون كثيرون لم يجدوه حين كان زرّاً شاحباً في آخر البطاقة -->
        <a class="btn primary sm" href="/login.html" id="topAccount"></a>
        <span class="grow"></span>
        <span id="langRow"></span>
      </div>
      <div class="center" style="padding: 10px 0 18px">
        <div class="brand hero" style="justify-content: center">
          <img class="logo light-only" src="/assets/logo.svg?v=1.53.0" alt="Tapio" width="249" height="159" /><img class="logo dark-only" src="/assets/logo-white.svg?v=1.53.0" alt="Tapio" width="249" height="159" />
        </div>
        <p class="muted small" style="margin-top: 8px" id="tagline"></p>
        <p id="welcome" class="hidden" style="margin: 10px 0 0; font-weight: 700"></p>
      </div>

      <div class="card">
        <h2 id="teacherTitle"></h2>
        <p class="muted small" id="teacherBody"></p>
        <a class="btn primary block big-cta" id="accountLink" href="/login.html"></a>
        <a class="btn accent block" href="/host.html" id="createBtn" style="margin-top: 8px"></a>
        <a class="btn ghost block" href="/host.html#/demo" style="margin-top: 8px" id="demoBtn"></a>
        <a class="btn ghost block" href="/games.html" id="gamesBtn" style="margin-top: 8px"></a>
        <a class="btn ghost block" href="/help.html" id="guideBtn" style="margin-top: 8px"></a>
        <button class="btn ghost block hidden" id="logoutBtn" type="button" style="margin-top: 8px"></button>
        <div id="resume" class="hidden" style="margin-top: 10px">
          <a class="btn ghost block" id="resumeLink" href="#"></a>
        </div>
      </div>

      <p class="center muted small" style="margin: 14px 0">
        <a href="/c" id="haveCode"></a>
      </p>

      <div class="card">
        <h3 id="whyTitle"></h3>
        <ul class="muted small" id="whyList" style="margin: 0; padding-inline-start: 20px; line-height: 2"></ul>
      </div>

      <p class="footer" id="pageFooter"></p>
    </div>

    <script src="/assets/js/avatar.js?v=1.53.0"></script>
    <script src="/assets/js/common.js?v=1.53.0"></script>
    <script src="/assets/js/footer.js?v=1.53.0"></script>
    <script>
      (function () {
        const { $, api, store, serverAlive, showOfflineBanner } = window.T;
        const t = window.I18n.t;

        document.title = t('brand') + ' — ' + t('homeTagline');
        window.I18n.mountToggle($('#langRow'));

        $('#tagline').textContent = t('homeTagline');
        $('#topAccount').textContent = t('homeLoginShort');
        $('#haveCode').textContent = t('homeHaveCode');
        $('#teacherTitle').textContent = t('homeTeacherTitle');
        $('#teacherBody').textContent = t('homeTeacherBody');
        $('#createBtn').textContent = t('homeCreateBtn');
        $('#demoBtn').textContent = t('homeDemoBtn');
        $('#gamesBtn').textContent = t('gNav');
        $('#guideBtn').textContent = t('homeGuideBtn');
        $('#accountLink').textContent = t('homeLoginBtn');
        $('#whyTitle').textContent = t('homeWhyTitle');
        $('#pageFooter').textContent = t('homeFooter');
        ['homeWhy1', 'homeWhy2', 'homeWhy3', 'homeWhy4'].forEach((key) => {
          const li = document.createElement('li');
          li.textContent = t(key);
          $('#whyList').append(li);
        });

        // تشخيص مبكر: إن كان الخادم غير متاح نشرح السبب بدل رسالة خطأ غامضة
        serverAlive().then((alive) => {
          if (!alive) showOfflineBanner(document.querySelector('.wrap'));
        });

        /**
         * رمزٌ في العنوان (‎/?code=‎ من رابطٍ قديم): نمرّره إلى صفحة الدخول
         * بدل أن نُبقي حقل رمزٍ في الواجهة. الروابط القديمة تبقى تعمل، والزائر
         * الذي لا رمز معه لا يُسأل عن رمز أصلاً.
         */
        const preset = new URLSearchParams(location.search).get('code');
        if (preset && /^\d{4,8}$/.test(preset)) location.replace('/play.html?code=' + preset);

        // إن كان مسجّل الدخول نوجّهه إلى أنشطته مباشرة
        api('/api/auth/me')
          .then(({ user }) => {
            if (!user) return;
            const link = $('#accountLink');
            link.href = '/host.html#/mine';
            link.textContent = t('homeMyActivities', { name: user.name });
            const top = $('#topAccount');
            top.href = '/host.html#/mine';
            top.textContent = t('homeMyActivitiesShort');
            const hello = $('#welcome');
            hello.textContent = t('homeWelcome', { name: String(user.name).trim().split(/\s+/)[0] });
            hello.classList.remove('hidden');
            // زر خروج ظاهر للمسجّلين على الصفحة الرئيسية أيضاً
            const out = $('#logoutBtn');
            out.classList.remove('hidden');
            out.textContent = t('homeLogoutBtn');
            out.addEventListener('click', async () => {
              await api('/api/auth/logout', { method: 'POST' }).catch(() => {});
              location.reload();
            });
          })
          .catch(() => {});

        // استئناف جلسة مدرب سابقة (المفتاح محفوظ في المتصفح فقط)
        const last = store.local.get('tafa3l:host:last', null);
        if (last?.code && last?.hostToken) {
          api('/api/sessions/' + last.code)
            .then(() => {
              $('#resume').classList.remove('hidden');
              $('#resumeLink').href = '/host.html#/live/' + last.code;
              $('#resumeLink').textContent = t('homeResumeBtn', { title: last.title || last.code });
            })
            .catch(() => {});
        }

      })();
    
      window.SiteFooter.mount();
    </script>
  </body>
</html>
