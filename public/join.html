<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Tapio</title>
    <meta name="description" content="ادخل إلى نشاط Tapio برمز الدخول المكوّن من ستة أرقام." />
    <meta name="theme-color" content="#171240" />
    <link rel="icon" href="/assets/icon.svg?v=1.83.0" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png?v=1.83.0" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/assets/css/app.css?v=1.83.0" />
    <script src="/assets/js/theme.js?v=1.83.0"></script>
    <script src="/assets/js/i18n.js?v=1.83.0"></script>
  </head>
  <body>
    <div class="wrap narrow">
      <div class="row" style="justify-content: flex-end; padding-top: 10px" id="langRow"></div>
      <div class="center" style="padding: 10px 0 18px">
        <a class="brand hero" href="/" style="justify-content: center">
          <img class="logo light-only" src="/assets/logo.svg?v=1.83.0" alt="Tapio" width="249" height="159" /><img
            class="logo dark-only"
            src="/assets/logo-white.svg?v=1.83.0"
            alt="Tapio"
            width="249"
            height="159"
          />
        </a>
      </div>

      <div class="card">
        <h2 id="joinTitle" style="display: flex; align-items: center; justify-content: space-between; gap: 8px"></h2>
        <!-- الخانات الستّ يبنيها mountCodeEntry المشترك مع الرئيسية -->
        <form id="joinForm" class="stack"></form>
      </div>

      <p class="center" style="margin-top: 14px">
        <a class="btn ghost" href="/" id="backHome"></a>
      </p>

    </div>

    <script src="/assets/js/common.js?v=1.83.0"></script>
    <script src="/assets/js/footer.js?v=1.83.0"></script>
    <script>
      (function () {
        const { $, serverAlive, showOfflineBanner, mountCodeEntry } = window.T;
        const t = window.I18n.t;

        document.title = t('brand') + ' — ' + t('homeJoinTitle');
        window.I18n.mountToggle($('#langRow'));
        window.Theme?.mountToggle($('#langRow'), { toDark: window.I18n.t('themeToDark'), toLight: window.I18n.t('themeToLight') });

        $('#joinTitle').append(t('homeJoinTitle'), window.T.hintDot(t('homeOrScan')));
        $('#backHome').textContent = t('joinBackHome');

        serverAlive().then((alive) => {
          if (!alive) showOfflineBanner(document.querySelector('.wrap'));
        });

        const { input } = mountCodeEntry($('#joinForm'), { autofocus: true });

        // رمزٌ في العنوان: من ‎?code=‎ أو من مسار ‎/c/123456‎ — يملأ الخانات
        // ويُرسل وحده عبر حدث input نفسه الذي تطلقه الكتابة اليدوية
        const params = new URLSearchParams(location.search);
        const fromPath = (location.pathname.match(/\/c\/(\d{4,8})/) || [])[1];
        const preset = params.get('code') || fromPath;
        if (preset) {
          input.value = String(preset).replace(/\D/g, '').slice(0, 6);
          input.dispatchEvent(new Event('input'));
        }
      })();

      window.SiteFooter.mount();
    </script>
  </body>
</html>
