<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Tapio</title>
    <meta name="description" content="ادخل إلى نشاط Tapio برمز الدخول المكوّن من ستة أرقام." />
    <meta name="theme-color" content="#171240" />
    <link rel="icon" href="/assets/icon.svg?v=1.94.0" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png?v=1.94.0" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/assets/css/app.css?v=1.94.0" />
    <link rel="stylesheet" href="/assets/css/entry.css?v=1.94.0" />
    <script src="/assets/js/theme.js?v=1.94.0"></script>
    <script src="/assets/js/i18n.js?v=1.94.0"></script>
  </head>
  <body class="tp-entry">
    <div class="tp-col">
      <div class="tp-fx tp-fx--dots" aria-hidden="true"></div>
      <div class="tp-fx tp-fx--glow-a" aria-hidden="true"></div>
      <div class="tp-fx tp-fx--glow-b" aria-hidden="true"></div>

      <form class="tp-join" id="joinForm">
        <div class="tp-join__bar tp-rise" style="--rise: 0ms">
          <a class="tp-back" href="/" id="backHome">→</a>
          <span style="flex: 1"></span>
          <a href="/" aria-label="Tapio">
            <img class="tp-join__logo light-only" src="/assets/logo.svg?v=1.94.0" alt="Tapio" width="249" height="159" /><img
              class="tp-join__logo dark-only"
              src="/assets/logo-white.svg?v=1.94.0"
              alt="Tapio"
              width="478"
              height="315"
            />
          </a>
        </div>

        <div class="tp-rise" style="--rise: 60ms">
          <h1 class="tp-join__title" id="joinTitle"></h1>
          <p class="tp-join__note" id="joinNote"></p>
        </div>

        <div class="tp-code tp-rise" id="codeBox" style="--rise: 120ms">
          <div class="tp-code__shell">
            <!-- المرسوم: ستّ خاناتٍ دائماً، ما كُتب رقماً وما بقي نقطة -->
            <span class="tp-code__view" id="codeView" aria-hidden="true"></span>
            <input
              class="tp-code__input"
              id="codeInput"
              type="text"
              inputmode="none"
              pattern="[0-9]*"
              maxlength="6"
              autocomplete="one-time-code"
              enterkeyhint="go"
            />
          </div>
          <div class="tp-code__track" aria-hidden="true"><span class="tp-code__fill" id="codeFill"></span></div>
          <p class="tp-code__hint" id="codeHint" role="status" aria-live="polite"></p>
        </div>

        <div class="tp-spacer" aria-hidden="true"></div>

        <div class="tp-pad tp-rise" id="pad" style="--rise: 180ms"></div>

        <button class="tp-act tp-join__submit" id="joinBtn" type="submit">
          <span class="tp-join__spin" aria-hidden="true"></span>
          <span id="joinBtnLabel"></span>
        </button>
      </form>
    </div>

    <script src="/assets/js/common.js?v=1.94.0"></script>
    <script src="/assets/js/footer.js?v=1.94.0"></script>
    <script>
      (function () {
        const { $, el, api, toast, serverAlive, showOfflineBanner } = window.T;
        const t = window.I18n.t;

        document.title = t('brand') + ' — ' + t('homeJoinTitle');

        const form = $('#joinForm');
        const input = $('#codeInput');
        const view = $('#codeView');
        const fill = $('#codeFill');
        const hint = $('#codeHint');
        const box = $('#codeBox');
        const btn = $('#joinBtn');
        const label = $('#joinBtnLabel');

        $('#joinTitle').textContent = t('joinTitle');
        $('#joinNote').textContent = t('joinNote');
        $('#backHome').setAttribute('aria-label', t('joinBackHome'));
        $('#backHome').title = t('joinBackHome');
        input.setAttribute('aria-label', t('homeCodeAria'));

        let busy = false;
        // نصُّ العطل لا رايةٌ صمّاء: «غير مكتمل» و«غير موجود» عطلان مختلفان،
        // ومن أدخل رمزاً كاملاً لا يصحّ أن يُقال له إنه ناقص
        let problem = '';

        serverAlive().then((alive) => {
          if (!alive) showOfflineBanner(document.querySelector('.tp-col'));
        });

        /**
         * لوحة الأرقام: ‎1..9‎ ثم مسحٌ وصفرٌ وتراجع.
         * ترتيبها بصريّ لا منطقيّ، ولذلك حاويتها `dir: ltr` في CSS — داخل
         * صفحةٍ RTL ينقلب الصفّ فيقرأ الطالب ٣ ٢ ١.
         */
        const KEYS = ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'clear', '0', 'back'];
        const glyph = { clear: 'C', back: '⌫' };
        KEYS.forEach((key) => {
          const node = el(
            'button',
            {
              class: 'tp-key',
              type: 'button',
              'aria-label': key === 'clear' ? t('joinKeyClear') : key === 'back' ? t('joinKeyBack') : key,
            },
            glyph[key] || key
          );
          node.addEventListener('click', () => press(key));
          $('#pad').append(node);
        });

        function press(key) {
          if (busy) return;
          const code = input.value;
          if (key === 'back') input.value = code.slice(0, -1);
          else if (key === 'clear') input.value = '';
          else if (code.length < 6) input.value = code + key;
          else return;
          problem = '';
          paint();
          // البؤرة تبقى في الحقل: من بدأ بلمس اللوحة يستطيع إكمالها بلوحة مفاتيحه
          input.focus({ preventScroll: true });
        }

        /**
         * الحقل مصدر الحقيقة الوحيد.
         *
         * لوحةُ الشاشة لا تكفي وحدها: من يفتح الصفحة على حاسوب يكتب بلوحته،
         * ومن وصله الرمز في رسالة يلصقه، وبعض الهواتف تعرض الرمز فوق لوحة
         * المفاتيح لتملأه (`one-time-code`). فكلُّ ذلك يمرّ من الحقل، ثم
         * يُرسم من هنا مرّةً واحدة. و`inputmode="none"` تمنع لوحة النظام من
         * الظهور فوق لوحتنا — فيبقى المكسب بلا ازدحام.
         */
        function paint() {
          const clean = input.value.replace(/\D/g, '').slice(0, 6);
          if (clean !== input.value) input.value = clean;
          const ready = clean.length === 6;

          // ستّ خانات دائماً: ما كُتب رقماً وما بقي نقطةً باهتة في موضعها
          view.replaceChildren();
          for (let i = 0; i < 6; i += 1) {
            view.append(clean[i] ? document.createTextNode(clean[i]) : el('span', { class: 'slot', text: '·' }));
          }
          fill.style.width = (clean.length / 6) * 100 + '%';

          box.classList.toggle('bad', Boolean(problem));
          box.classList.toggle('ready', ready && !problem);
          btn.classList.toggle('ready', ready || busy);
          btn.classList.toggle('busy', busy);
          label.textContent = busy ? t('joinBusyBtn') : t('joinSubmitBtn');
          hint.textContent = problem || (busy ? t('joinBusyHint') : ready ? t('joinReadyHint') : ' ');
        }

        input.addEventListener('input', () => {
          problem = '';
          paint();
        });
        // النقر داخل الحقل لا يضع المؤشّر بين رقمين: الكتابة دائماً في آخره
        const toEnd = () => setTimeout(() => input.setSelectionRange(input.value.length, input.value.length), 0);
        input.addEventListener('click', toEnd);
        input.addEventListener('focus', toEnd);

        form.addEventListener('submit', async (event) => {
          event.preventDefault();
          if (busy) return;
          if (input.value.length !== 6) {
            problem = t('joinIncomplete');
            paint();
            return;
          }
          busy = true;
          paint();
          try {
            await api('/api/sessions/' + input.value);
            location.href = '/play.html?code=' + input.value;
          } catch (err) {
            busy = false;
            // رسالة الخادم هي الأدقّ («لا يوجد نشاط بهذا الرمز»)، وتُعرض في
            // البطاقة لا في تنبيهٍ يختفي بعد ثانيتين
            problem = err.message || t('joinNotFound');
            paint();
          }
        });

        /**
         * رمزٌ في العنوان: من ‎?code=‎ أو من مسار ‎/c/123456‎ — يملأ الحقل
         * ويُرسل وحده، فالرابط المشترَك ينقل الطالب إلى النشاط بلا ضغطة.
         */
        const params = new URLSearchParams(location.search);
        const fromPath = (location.pathname.match(/\/c\/(\d{4,8})/) || [])[1];
        const preset = params.get('code') || fromPath;
        if (preset) {
          input.value = String(preset).replace(/\D/g, '').slice(0, 6);
          paint();
          if (input.value.length === 6) form.requestSubmit();
        } else {
          paint();
          input.focus({ preventScroll: true });
        }
      })();

      window.SiteFooter.mount();
    </script>
  </body>
</html>
