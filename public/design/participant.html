<!doctype html>
<html lang="ar" dir="rtl" data-theme-default="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Tapio — معاينة شاشة إجابة المتدرب</title>
    <link rel="icon" href="/assets/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/assets/css/app.css?v=1.67.0" />
    <link rel="stylesheet" href="/assets/css/tapio-base.css?v=1.67.0" />
    <link rel="stylesheet" href="/assets/css/participant.css?v=1.67.0" />
    <!-- يُحمَّل في الرأس ليضبط السِمَة قبل أي رسم، فلا تومض الفاتحة على الداكنة -->
    <script src="/assets/js/theme.js?v=1.67.0"></script>
    <style>
      /* لوحة معاينة ساكنة: الحالات الأربع بسِمَة الصفحة، ومبدّلٌ يقلبها كلها.
         لا لون هنا خارج الرموز — اللوحة نفسها بلون رمز اللوحة. */
      .canvas {
        min-height: 100dvh;
        padding: var(--tp-s-24);
        background: var(--tp-canvas);
        color: var(--tp-text);
      }
      .head-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--tp-s-16);
        flex-wrap: wrap;
      }
      .canvas h1 {
        font-size: var(--tp-fs-22);
        margin: 0 0 var(--tp-s-8);
      }
      .canvas .lead {
        margin: 0 0 var(--tp-s-24);
        color: var(--tp-muted);
        font-size: var(--tp-fs-14);
        max-width: 70ch;
      }
      .grid {
        display: flex;
        flex-wrap: wrap;
        gap: var(--tp-s-24);
      }
      .cell {
        display: flex;
        flex-direction: column;
        gap: var(--tp-s-8);
        margin: 0;
        /* الإطار مقاسُ جهاز: لا ينضغط لأن اللوحة ضاقت */
        flex: 0 0 auto;
        width: var(--tp-frame-w);
        max-width: 100%;
      }
      .cell > figcaption {
        font-size: var(--tp-fs-13);
        font-weight: var(--tp-w-700);
        color: var(--tp-muted);
      }
    </style>
  </head>
  <body>
    <div class="canvas tp">
      <div class="head-row">
        <h1>شاشة إجابة المتدرب — الحالات الأربع</h1>
        <span id="themeRow"></span>
      </div>
      <p class="lead">
        معاينة ساكنة مبنيّة بمكوّنات <code>participant-ui.js</code> نفسها التي تعمل في صفحة اللعب،
        فما تراه هنا هو ما يراه الطالب. الإطارات تتبع سِمَة الصفحة — بدّلها بالزرّ أعلاه لترى
        السِمَة الأخرى. المقاس 390×780 مقاس مخطوطة، والشاشة الحقيقية مرنة.
      </p>
      <div class="grid" id="grid"></div>
    </div>

    <script src="/assets/js/participant-ui.js?v=1.67.0"></script>
    <script>
      (function () {
        'use strict';
        const UI = window.TapioUI;
        const el = UI.el;

        window.Theme?.mountToggle(document.getElementById('themeRow'), {
          toDark: 'السِمَة الداكنة',
          toLight: 'السِمَة الفاتحة',
        });

        // نموذج سؤالٍ واحد تُعرض عليه الحالات كلها — مثال DESIGN.md نفسه
        const LETTERS = 'أبجدهوزح';
        const Q = {
          text: 'ما عاصمة الجزائر؟',
          options: [
            { text: 'الرباط', correct: false },
            { text: 'الجزائر', correct: true },
            { text: 'تونس', correct: false },
            { text: 'طرابلس', correct: false },
          ],
        };
        const MANY = ['الرباط', 'الجزائر', 'تونس', 'طرابلس', 'القاهرة', 'عمّان'];

        /** بناء شاشة كاملة بحالةٍ واحدة */
        function screen(opts) {
          const options = opts.options || Q.options;
          const palette = options.length <= 4;
          const stage = el('div', { class: 'tp-stage' }, [el('h1', { class: 'tp-q', text: Q.text })]);

          if (opts.waiting) stage.append(UI.WaitingIndicator({ text: 'إجابتك وصلت — بانتظار بقية الصف' }));
          if (opts.status) stage.append(UI.StatusLine(opts.status));

          const list = el('div', { class: 'tp-options' });
          options.forEach((option, index) => {
            list.append(
              UI.AnswerOption({
                letter: UI.letterAt(LETTERS, index),
                text: option.text || option,
                slot: index,
                palette,
                interactive: false,
                state: opts.stateFor(index, option),
                chip: 'اختيارك',
              })
            );
          });

          const timer = UI.Timer({ total: 30 });
          timer.set(opts.msLeft === undefined ? 18000 : opts.msLeft);
          if (opts.msLeft === 0) timer.expire();

          return el('div', { class: 'tp-screen' }, [
            el('div', { class: 'tp-head' }, [
              UI.HeaderStat({ kind: 'counter', value: 3, total: 10 }),
              UI.HeaderStat({ kind: 'score', value: opts.score === undefined ? 240 : opts.score, label: 'pts' }),
            ]),
            timer.node,
            stage,
            list,
          ]);
        }

        // الحالات الأربع كما في DESIGN.md §2، ثم حالة الخمسة خيارات فأكثر
        const CELLS = [
          {
            id: 'state-1-active',
            name: '١ — نشِط',
            stateFor: () => 'idle',
          },
          {
            id: 'state-2-waiting',
            name: '٢ — مختار / بانتظار',
            waiting: true,
            stateFor: (index) => (index === 1 ? 'selected' : 'faded'),
          },
          {
            id: 'state-3-correct',
            name: '٣ — كُشِف: إجابة صحيحة',
            msLeft: 0,
            score: 360,
            status: { tone: 'correct', text: 'إجابة صحيحة', delta: '+120' },
            stateFor: (index) => (index === 1 ? 'correct' : 'neutral'),
          },
          {
            id: 'state-4-wrong',
            name: '٤ — كُشِف: إجابة خاطئة',
            msLeft: 0,
            status: { tone: 'wrong', text: 'إجابة خاطئة', delta: '+0', right: 'الصحيح: ب الجزائر' },
            stateFor: (index) => (index === 1 ? 'correct' : index === 2 ? 'wrong' : 'neutral'),
          },
          {
            id: 'many-options',
            name: 'ستة خيارات — سطح محايد بلا درجاتٍ مخترعة',
            options: MANY.map((text) => ({ text })),
            stateFor: () => 'idle',
          },
        ];

        const grid = document.getElementById('grid');
        CELLS.forEach((cell) => {
          grid.append(
            el('figure', { class: 'cell' }, [
              el('figcaption', { text: cell.name }),
              el('div', { class: 'tp tp-frame', 'data-shot': cell.id }, screen(cell)),
            ])
          );
        });
      })();
    </script>
  </body>
</html>
