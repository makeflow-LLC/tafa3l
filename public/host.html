<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Tapio</title>
    <meta name="theme-color" content="#171240" />
    <link rel="icon" href="/assets/icon.svg?v=1.77.1" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png?v=1.77.1" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/assets/css/app.css?v=1.77.1" />
    <link rel="stylesheet" href="/assets/css/tapio-base.css?v=1.77.1" />
    <link rel="stylesheet" href="/assets/css/teacher.css?v=1.77.1" />
    <link rel="stylesheet" href="/assets/css/designer.css?v=1.77.1" />
    <script src="/assets/js/theme.js?v=1.77.1"></script>
    <script src="/assets/js/i18n.js?v=1.77.1"></script>
  </head>
  <body>
    <div class="topbar tp">
      <!-- هوية المعلّم في طرف، والشعار ورمز اللغة في الطرف الآخر، وما عداهما
           خلف زرٍّ واحد: شاشة الجوال لا تحتمل صفّاً من ثمانية أزرار -->
      <!-- زرّ القائمة في **بداية القراءة**: يمين الشاشة بالعربية ويسارها
           بالإنجليزية، وتنسدل لوحته من الطرف نفسه فلا يقطعها حدّ الشاشة -->
      <div class="tp-bar-start">
        <div class="tp-menu">
          <button id="menuBtn" class="icon-btn tp-menu__btn" type="button" aria-haspopup="menu" aria-expanded="false">⋯</button>
          <!-- سطورها تُبنى في host.js: هوية الحساب، ثم تنقّل، ثم إعدادات، ثم الحساب -->
          <div id="hostMenu" class="tp-menu__panel" role="menu" hidden></div>
        </div>
        <a class="tp-who" href="#/profile" id="whoLink">
          <span class="tp-avatar" id="whoAvatar" aria-hidden="true"></span>
          <span class="tp-who__name" id="whoName"></span>
        </a>
      </div>
      <div class="tp-bar-end">
        <span id="codeBadge" class="badge hidden"></span>
        <span id="conn" class="badge hidden">…</span>
        <!-- الشعار يعود إلى رئيسية **المعلّم** لا إلى الموقع العام: حُذف سطر
             «الصفحة الرئيسية» من القائمة لأن الشعار يكفي، لكنه كان يخرج
             المعلّم من لوحته كلّها. الآن يكفي فعلاً. -->
        <a class="brand" href="#/" style="text-decoration: none; color: inherit">
          <img class="logo light-only" src="/assets/logo.svg?v=1.77.1" alt="Tapio" width="249" height="159" /><img class="logo dark-only" src="/assets/logo-white.svg?v=1.77.1" alt="Tapio" width="249" height="159" />
        </a>
        <span id="langRow"></span>
      </div>
    </div>

    <div class="wrap tp" id="app">
      <div class="card center"><div class="spinner"></div></div>
    </div>

    <div id="bar"></div>

    <script src="/assets/js/avatar.js?v=1.77.1"></script>
    <script src="/assets/js/fx.js?v=1.77.1"></script>
    <script src="/assets/js/templates.js?v=1.77.1"></script>
    <script src="/assets/js/common.js?v=1.77.1"></script>
    <script src="/assets/js/participant-ui.js?v=1.77.1"></script>
    <script src="/assets/js/teacher-ui.js?v=1.77.1"></script>
    <script src="/assets/js/designer-ui.js?v=1.77.1"></script>
    <script src="/assets/js/footer.js?v=1.77.1"></script>
    <script src="/assets/js/import-sheet.js?v=1.77.1"></script>
    <script src="/assets/js/builder.js?v=1.77.1"></script>
    <script src="/assets/js/ai-chat.js?v=1.77.1"></script>
    <script src="/assets/js/analytics.js?v=1.77.1"></script>
    <script src="/assets/js/export.js?v=1.77.1"></script>
    <script src="/assets/js/host.js?v=1.77.1"></script>
    <script>
      window.SiteFooter.mount();
    </script>
  </body>
</html>
