<!doctype html>
<html lang="ar" dir="rtl" class="stage">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Tapio — المشاركة</title>
    <meta name="theme-color" content="#12102e" />
    <link rel="icon" href="/assets/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/assets/css/app.css?v=1.25.0" />
  </head>
  <body>
    <div class="topbar">
      <div class="brand"><img class="dot" src="/assets/icon.svg?v=1.25.0" alt="" width="34" height="34" /><span id="quizTitle">Tapio</span></div>
      <div class="row" style="gap: 6px">
        <button id="exitBtn" class="icon-btn" type="button" title="الخروج من النشاط" aria-label="الخروج من النشاط">🚪</button>
        <button id="soundBtn" class="icon-btn" type="button" title="الصوت" aria-label="تشغيل أو كتم الصوت">🔊</button>
        <span id="conn" class="badge">…</span>
        <span id="teamBadge" class="badge hidden"></span>
        <span id="scoreBadge" class="badge hidden">0</span>
      </div>
    </div>

    <div class="wrap narrow" id="app">
      <div class="card center"><div class="spinner"></div></div>
    </div>

    <script src="/assets/js/avatar.js?v=1.25.0"></script>
    <script src="/assets/js/fx.js?v=1.25.0"></script>
    <script src="/assets/js/common.js?v=1.25.0"></script>
    <script src="/assets/js/play.js?v=1.25.0"></script>
  </body>
</html>
