<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Tapio</title>
    <meta name="theme-color" content="#171240" />
    <link rel="icon" href="/assets/icon.svg?v=1.80.0" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png?v=1.80.0" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/assets/css/app.css?v=1.80.0" />
    <link rel="stylesheet" href="/assets/css/tapio-base.css?v=1.80.0" />
    <link rel="stylesheet" href="/assets/css/participant.css?v=1.80.0" />
    <script src="/assets/js/theme.js?v=1.80.0"></script>
    <script src="/assets/js/i18n.js?v=1.80.0"></script>
  </head>
  <body>
    <div class="topbar tp">
      <!-- الصوت واللغة والسِمَة خلف زرٍّ واحد، في بداية القراءة: يمين الشاشة
           بالعربية ويسارها بالإنجليزية، وتنسدل لوحته من الطرف نفسه -->
      <div class="tp-bar-start">
        <div class="tp-menu">
          <button id="exitBtn" class="icon-btn tp-menu__btn" type="button" aria-haspopup="menu" aria-expanded="false">⋯</button>
          <!-- سطورها تُبنى في play.js: الصوت واللغة والسِمَة ثم المغادرة -->
          <div id="exitMenu" class="tp-menu__panel" role="menu" hidden></div>
        </div>
        <div class="brand"><img class="dot" src="/assets/icon.svg?v=1.80.0" alt="" width="34" height="34" /><span id="quizTitle" class="title-line">Tapio</span></div>
      </div>
      <div class="tp-bar-end">
        <span id="conn" class="badge">…</span>
        <span id="teamBadge" class="badge hidden"></span>
        <span id="scoreBadge" class="badge hidden">0</span>
      </div>
    </div>

    <div class="wrap narrow tp tp-app" id="app">
      <div class="card center"><div class="spinner"></div></div>
    </div>

    <script src="/assets/js/avatar.js?v=1.80.0"></script>
    <script src="/assets/js/fx.js?v=1.80.0"></script>
    <script src="/assets/js/common.js?v=1.80.0"></script>
    <script src="/assets/js/participant-ui.js?v=1.80.0"></script>
    <script src="/assets/js/play.js?v=1.80.0"></script>
  </body>
</html>
