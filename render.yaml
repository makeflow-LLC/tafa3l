# نشر «Tapio» على Render — لا بد أن يكون النوع web (عملية Node دائمة)
# وليس static، لأن التطبيق يحتاج WebSocket وحالة في الذاكرة.
services:
  - type: web
    name: tafa3l
    runtime: node
    plan: free
    # حالة الجلسات الحيّة كلها في ذاكرة العملية (store.js) ومقابس الويب معها،
    # فنسخة واحدة فقط. رفع العدد يجعل الطالب يصل خادماً لا يعرف رمز جلسته.
    numInstances: 1
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production

      # نسخة مثبّتة: الكود يعتمد fetch العام (عقدة ١٨+)، والتثبيت يمنع تغيّر
      # النسخة الافتراضية للمنصة من أن يصير متغيّراً غير مُختبَر في نشر الإنتاج.
      - key: NODE_VERSION
        value: 22

      # يمنع نوم الخدمة أثناء المحاضرة: الخادم ينبض لنفسه ما دامت هناك جلسة قائمة.
      # RENDER_EXTERNAL_URL تضبطه Render تلقائياً، لذلك لا تحتاج كتابة العنوان.
      - key: KEEP_ALIVE_MINUTES
        value: "10"

      # مدة بقاء الجلسة في الذاكرة بلا نشاط (بالدقائق) — ارفعها للمحاضرات الطويلة
      - key: SESSION_IDLE_MINUTES
        value: "300"

      # مدة بقاء نتائج جلسة انتهت قبل حذفها (بالدقائق)
      - key: SESSION_ENDED_MINUTES
        value: "60"

      # لبقاء حسابات المدربين وأنشطتهم المحفوظة بعد كل نشر.
      # بدونها تُخزَّن في ملف محلي يضيع مع القرص المؤقت للخطة المجانية.
      # أنشئ قاعدة Postgres (Render أو Supabase أو Neon) وضع رابطها هنا:
      # - key: DATABASE_URL
      #   value: postgres://user:pass@host:5432/dbname

      # تسجيل دخول المدرب عبر جوجل فقط — بلا كلمات مرور. بدون هذين المتغيّرين
      # يبقى التطبيق يعمل، لكن صفحة الدخول تعرض تنبيهاً بدل زر فعّال.
      # أنشئهما من Google Cloud Console (راجع قسم «تفعيل الدخول عبر جوجل» في README):
      # - key: GOOGLE_CLIENT_ID
      #   value: xxxxxxxx.apps.googleusercontent.com
      # - key: GOOGLE_CLIENT_SECRET
      #   value: xxxxxxxx

      # «صمّم نشاطك بالذكاء الاصطناعي» — مفتاح Azure OpenAI.
      # ⚠️ لا تكتب المفتاح في المستودع أبداً: أضفه من لوحة Render
      # (Environment ← Add Environment Variable) وحدها.
      # - key: AZURE_OPENAI_KEY
      #   value: <المفتاح من بوابة أزور>
      # - key: AZURE_OPENAI_ENDPOINT
      #   value: https://<موردك>.services.ai.azure.com/api/projects/<مشروعك>/openai/v1/responses
      # - key: AZURE_OPENAI_MODEL
      #   value: gpt-4.1

      # «ولّد صورة اللعبة» — مفتاح Evolink (يقرأ شيفرة اللعبة ويرسم غلافها).
      # ⚠️ المفتاح نفسه لا يُكتب هنا: أضفه من لوحة Render وحدها.
      # - key: EVOLINK_API_KEY
      #   value: <المفتاح من evolink.ai>
      # وهذان اختياريان — القيم الافتراضية مكتوبة في server/game-cover.js:
      # - key: EVOLINK_TEXT_MODEL
      #   value: gemini-3.5-flash-lite
      # - key: EVOLINK_IMAGE_MODEL
      #   value: gemini-3.1-flash-lite-image
      # «منشئ الألعاب التفاعلية» يستعمل المفتاح نفسه (EVOLINK_API_KEY) —
      # نموذجٌ واحد يبني ملفّ اللعبة كاملاً. وهذه اختيارية، وقيمها الافتراضية
      # في server/game-builder.js:
      # - key: EVOLINK_GAME_MODEL
      #   value: gemini-3.7-flash
      # مهلة بناء اللعبة بالمللي ثانية (الافتراضي سبع دقائق):
      # - key: EVOLINK_BUILD_TIMEOUT_MS
      #   value: "420000"
      # سقف مخرجات البناء بالرموز — ملفّ لعبةٍ كاملة لا مسودة أسئلة:
      # - key: EVOLINK_BUILD_MAX_TOKENS
      #   value: "60000"
      # كم لعبةً يبنيها المعلّم الواحد في الساعة:
      # - key: GAME_AI_HOURLY_LIMIT
      #   value: "20"

      # حصّة بناء الألعاب. المجاني: لعبتان في **عمر الحساب** لا تتجدّدان.
      # المشترك: عشرون كل شهر ميلادي. والمالك بلا حدّ. (اختياريان — هذه قيمهما)
      # - key: GAME_FREE_TOTAL
      #   value: "2"
      # - key: GAME_PREMIUM_MONTHLY
      #   value: "20"

      # عنوان متابعة مهمّة الرسم — الرسم غير متزامن، ونستطلعه حتى يكتمل.
      # يُضبط فقط إن لم يُصب أحدُ المرشّحين في server/game-cover.js
      # ({id} موضع معرّف المهمّة):
      # - key: EVOLINK_TASK_ENDPOINT
      #   value: https://api.evolink.ai/v1/tasks/{id}

      # اشتراك بريميوم ولوحة المالك (كلها اختيارية، ولها قيم افتراضية):
      # - key: ADMIN_EMAILS
      #   value: jihad@makeflow.tech
      # - key: PREMIUM_WHATSAPP
      #   value: "970597034066"
      # - key: PREMIUM_PRICE_USD
      #   value: "5"
      # منحة التسجيل: أيام بريميوم لكل حساب جديد (صفر = إيقافها)
      # - key: PREMIUM_SIGNUP_TRIAL_DAYS
      #   value: "10"
